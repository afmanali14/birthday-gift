<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories</title>

<style>
body{
margin:0;
height:100vh;
background:linear-gradient(#ff7bbd,#ffd1e8);
overflow:hidden;
font-family:Segoe UI,sans-serif;
}

/* BACK BUTTON */
#backBtn{
position:fixed;
top:18px;
left:18px;
background:rgba(255,255,255,.35);
border:none;
padding:10px 16px;
border-radius:30px;
color:white;
font-size:16px;
cursor:pointer;
backdrop-filter:blur(6px);
z-index:1000;
}

/* PHOTO CARDS */
.photo{
position:absolute;
width:90px;
height:120px;
border-radius:16px;
background:#000;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:36px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 12px rgba(255,255,255,.6);
animation:float 4s infinite ease-in-out;
overflow:hidden;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

@keyframes float{
50%{transform:translateY(-25px)}
}

/* OVERLAY */
#overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:999;
padding:20px;
}

#overlay img{
width:260px;
max-width:90%;
border-radius:20px;
box-shadow:0 0 25px white;
}

#msg{
margin-top:15px;
font-size:18px;
line-height:1.5;
text-align:center;
max-height:35vh;
overflow-y:auto;
padding:0 10px;
}

/* SCROLLBAR */
#msg::-webkit-scrollbar{width:5px}
#msg::-webkit-scrollbar-thumb{
background:#ff7bbd;
border-radius:10px;
}

/* EMOJI RAIN */
.heart{
position:fixed;
animation:fall linear forwards;
pointer-events:none;
}

@keyframes fall{
to{transform:translateY(120vh);opacity:0}
}

/* NEXT BUTTON */
#nextBtn{
display:none;
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
padding:14px 34px;
border:none;
border-radius:40px;
background:#ff2f92;
color:white;
font-size:18px;
cursor:pointer;
box-shadow:0 0 15px rgba(255,255,255,.5);
}

@media(max-width:600px){
.photo{width:75px;height:100px;}
#overlay img{width:220px;}
#msg{font-size:16px;}
}
</style>
</head>

<body>

<button id="backBtn" onclick="history.back()">← Back</button>

<div id="container"></div>

<div id="overlay">
<img id="bigImg">
<div id="msg"></div>
</div>

<button id="nextBtn" onclick="location.href='page4.html'">
Final surprise...
</button>

<script>
/* IMAGES */
let images=[
"https://i.postimg.cc/MpH3zQhT/Harman_4.jpg",
"https://i.postimg.cc/y6Qkx7fp/image_for_lline_2.jpg",
"https://i.postimg.cc/jqFSKZ5y/image_for_line_3.jpg",
"https://i.postimg.cc/G35mrq2y/image_for_line_4.jpg",
"https://i.postimg.cc/k5Yg4csS/Whats_App_Image_2026_01_30_at_12_16_13_PM_(1).jpg",
"https://i.postimg.cc/sxqjcDq2/Mix_Collage_02_Feb_2026_08_27_PM_9526.jpg",
"https://i.postimg.cc/jd1wgRPd/image_for_line_7.jpg",
"https://i.postimg.cc/j5vQCB94/Whats_App_Image_2026_01_30_at_12_15_41_PM_(1).jpg",
"https://i.postimg.cc/X7PGHndv/image_for_line_9.jpg",
"https://i.postimg.cc/RFPKvK6d/Whats_App_Image_2026_01_30_at_12_16_14_PM_(1).jpg",
"https://i.postimg.cc/L6WYCmL2/image_for_line_11.jpg",
"https://i.postimg.cc/Nfn9JQmt/image_for_line_12.jpg"
];

/* MESSAGES */
let messages=[
"You don’t just make me smile… you somehow make even my dull days feel brighter and warmer, and I honestly feel lucky every day to have you in my life 🌞💖🍀",
"My favorite person, today and always — someone I’m truly grateful to have, because some people are pure magic and you’re definitely one of those rare souls 🤗✨🥰",
"My comfort person, my happy place, and one of my biggest blessings — you’re not just a friend, you truly make my world better 🤍🌸",
"You are sunshine mixed with kindness, and it shows in everything you do… effortlessly beautiful, inside and out, in ways words can’t explain 🌞✨🌸",
"Our connections are rare and ours is something I truly treasure — you are genuinely special, and your kindness makes you shine 💎🤍",
"You are my favorite chapter in life’s story, one I’ll always reread, and I’ll forever be thankful for your friendship and the bond we share 📖💖🫶",
"Cheers to us and all the countless memories still waiting for us — my favorite vibe will always be you and your beautiful energy 🥂✨🌷",
"You’re my happy coincidence, one of life’s sweetest surprises, and honestly one of life’s sweetest gifts that I’ll always value 🍀💞🎁",
"My safe space, my bestie, and someone I truly cherish — forever proud of the person you are and the heart you carry 🤗🌸✨",
"You deserve all the happiness this world has to offer, and I’ll always be here for you, in every phase, always 🌍💞🤗",
"You honestly mean more to me than words can ever explain, thank you for choosing me as your friend and trusting me with your world 🥹💖🤍",
"Just know this — you’re special in ways you don’t even realize, and I’m grateful for you today, tomorrow, and always 😌🌷💗"
];

/* MUSIC - UPDATED CATBOX LINKS */
let music=[
"https://files.catbox.moe/k8u67u.mp3",
"https://files.catbox.moe/l69ait.mp3",
"https://files.catbox.moe/gqnpua.mp3",
"https://files.catbox.moe/74bsix.mp3",
"https://files.catbox.moe/d52hmc.mp3",
"https://files.catbox.moe/8j5t5o.mp3",
"https://files.catbox.moe/msbyob.mp3",
"https://files.catbox.moe/rnjwvx.mp3"
];

let audio=new Audio();
audio.loop=true;

let container=document.getElementById("container");
let overlay=document.getElementById("overlay");
let big=document.getElementById("bigImg");
let msg=document.getElementById("msg");
let nextBtn=document.getElementById("nextBtn");

/* 🔓 UNLOCK AUDIO ON FIRST USER TAP */
document.body.addEventListener("click",()=>{
audio.play().then(()=>audio.pause()).catch(()=>{});
},{once:true});

/* RANDOM PLACEMENT */
let placed=[];
function place(card){
let t=0;
while(t<150){
let x=Math.random()*(innerWidth-100);
let y=Math.random()*(innerHeight-140);
let ok=true;
for(let p of placed){
if(Math.abs(p.x-x)<90 && Math.abs(p.y-y)<120) ok=false;
}
if(ok){
placed.push({x,y});
card.style.left=x+"px";
card.style.top=y+"px";
return;
}
t++;
}
}

/* CREATE CARDS */
images.forEach((src,i)=>{
let d=document.createElement("div");
d.className="photo";
d.innerHTML="?";

let img=document.createElement("img");
img.src=src;
d.appendChild(img);

place(d);

d.onclick=()=>{
img.style.display="block";
d.innerHTML="";
overlay.style.display="flex";
big.src=src;
msg.innerHTML=messages[i];
nextBtn.style.display="block";

let idx=i % music.length;
audio.pause();
audio.src=music[idx];
audio.currentTime=0;
audio.play().catch(()=>{});
};

container.appendChild(d);
});

/* CLOSE OVERLAY */
overlay.onclick=()=>{
overlay.style.display="none";
audio.pause();
};

/* EMOJI RAIN */
function rain(){
let arr=["❤️","✨","🥰","🤍","🌸"];
for(let i=0;i<3;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML=arr[Math.floor(Math.random()*arr.length)];
h.style.left=Math.random()*100+"vw";
h.style.fontSize=18+Math.random()*30+"px";
h.style.animationDuration=2+Math.random()*3+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),5000);
}
}
setInterval(rain,100);
</script>

</body>
</html>
