<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cake Surprise</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#ff7bbd;
font-family:Segoe UI,sans-serif;
overflow:hidden;
}

#wrap{text-align:center;position:relative}

#cakeArea{
position:relative;
width:360px;
max-width:90vw;
}

#cake{width:100%;display:block}

/* CAKE HALVES */
.half{
display:none;
position:absolute;
top:0;
height:100%;
width:50%;
background:url("https://i.postimg.cc/0yXB2KqV/Chat_GPT_Image_Jan_28_2026_09_39_06_PM_removebg_preview.png") no-repeat;
background-size:200% 100%;
z-index:5;
}
#leftHalf{left:0;background-position:left}
#rightHalf{right:0;background-position:right}

/* CANDLES */
.candle{
position:absolute;
top:8%;
width:6%;
height:32%;
background:linear-gradient(#fff,#ffb3d9 70%,transparent);
border-radius:6px;
z-index:10;
}
.flame{
position:absolute;
top:-32%;
left:50%;
transform:translateX(-50%);
width:70%;
height:32%;
background:radial-gradient(circle,#fff,orange,red);
clip-path:polygon(50% 0%,65% 30%,100% 60%,50% 100%,0% 60%,35% 30%);
animation:flicker .25s infinite alternate;
cursor:pointer;
}
@keyframes flicker{to{transform:translateX(-50%) scale(1.2)}}

#c1{left:18%}
#c2{left:38%}
#c3{left:58%}
#c4{left:78%}

/* KNIFE */
#knife{
display:none;
width:60%;
position:absolute;
right:-35%;
top:60%;
transform:translateY(-50%);
transition:.6s;
cursor:pointer;
z-index:15;
}

/* TEXT */
#cmd{margin-top:18px;font-size:20px;color:white}

#big{
display:none;
position:fixed;
bottom:-200px;
width:100%;
text-align:center;
font-size:34px;
font-weight:800;
color:white;
animation:jump 1s forwards,float 3s infinite ease-in-out;
}
@keyframes jump{to{bottom:70%}}
@keyframes float{50%{transform:translateY(-20px)}}

#finalText{
display:none;
position:fixed;
bottom:-300px;
width:100%;
text-align:center;
color:white;
animation:finalJump 1.2s forwards,finalFloat 3s infinite ease-in-out;
}
#finalText h1{margin:0;font-size:42px}
#finalText h2{margin-top:12px;font-size:30px}
@keyframes finalJump{to{bottom:68%}}
@keyframes finalFloat{50%{transform:translateY(-20px)}}

.pop,.heart{position:fixed;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(120vh);opacity:0}}

#nextBtn{
display:none;
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
padding:14px 34px;
border:none;
border-radius:40px;
background:#ff2f92;
color:white;
font-size:18px;
cursor:pointer;
}

#backBtn{
position:fixed;
top:18px;
left:18px;
background:rgba(255,255,255,.35);
border:none;
padding:10px 16px;
border-radius:30px;
color:white;
font-size:16px;
cursor:pointer;
backdrop-filter:blur(6px);
}

@media(max-width:768px){
#big{font-size:26px}
#finalText h1{font-size:32px}
#finalText h2{font-size:22px}
}
</style>
</head>

<body>

<button id="backBtn" onclick="history.back()">← Back</button>

<div id="wrap">
<div id="cakeArea">

<img id="cake" src="https://i.postimg.cc/0yXB2KqV/Chat_GPT_Image_Jan_28_2026_09_39_06_PM_removebg_preview.png">

<div id="leftHalf" class="half"></div>
<div id="rightHalf" class="half"></div>

<div class="candle" id="c1"><div class="flame"></div></div>
<div class="candle" id="c2"><div class="flame"></div></div>
<div class="candle" id="c3"><div class="flame"></div></div>
<div class="candle" id="c4"><div class="flame"></div></div>

<img id="knife" src="https://i.postimg.cc/W1LPTTds/website_knife.png">

</div>
<div id="cmd">Tap the flames</div>
</div>

<div id="big">Happiiieesssttt Birthday My Cuttiieesssttt Doll 🧸❤️🤗</div>

<div id="finalText">
<h1>Huuurrrraaaaaaaayyyyyyyyyyyyy!!!!!!!!</h1>
<h2>Happiest Birthday Once Again My Princess ji 😊❤️</h2>
</div>

<button id="nextBtn" onclick="location.href='next.html'">Let me show u something...</button>

<script>
const flames=document.querySelectorAll(".flame");
const candles=document.querySelectorAll(".candle");
const knife=document.getElementById("knife");
const cake=document.getElementById("cake");
const left=document.getElementById("leftHalf");
const right=document.getElementById("rightHalf");
const big=document.getElementById("big");
const finalText=document.getElementById("finalText");
const nextBtn=document.getElementById("nextBtn");
const cmd=document.getElementById("cmd");

let bgMusic=null;
let musicUnlocked=false;

function pop(){
let p=document.createElement("div");
p.className="pop";
p.innerHTML="🎉";
p.style.left=Math.random()*100+"vw";
p.style.fontSize=15+Math.random()*30+"px";
p.style.animationDuration=1+Math.random()*2+"s";
document.body.appendChild(p);
setTimeout(()=>p.remove(),3000);
}

function heart(){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=15+Math.random()*35+"px";
h.style.animationDuration=2+Math.random()*3+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),5000);
}

flames.forEach(f=>{
f.onclick=()=>{

/* 🎵 MOBILE UNLOCKED MUSIC */
if(!musicUnlocked){
bgMusic=new Audio("https://www.dropbox.com/scl/fi/55t9esvgj3vidum8x3srx/bayside-breeze.mp3?dl=1");
bgMusic.loop=true;
bgMusic.play().then(()=>musicUnlocked=true).catch(()=>{});
}

flames.forEach(x=>x.style.display="none");
candles.forEach(c=>c.style.display="none");
cmd.innerHTML="";
big.style.display="block";

let burst=setInterval(()=>{pop();heart();},50);

setTimeout(()=>{
clearInterval(burst);
knife.style.display="block";
cmd.innerHTML="Tap the knife to cut the cake";
},4500);
};
});

knife.onclick=()=>{
big.style.display="none";
knife.style.transform="translate(-80px,-50%)";

setTimeout(()=>{
left.style.display="block";
right.style.display="block";
cake.style.opacity="0";
finalText.style.display="block";
setTimeout(()=>nextBtn.style.display="block",3000);

let finalBurst=setInterval(()=>{pop();heart();},60);
setTimeout(()=>clearInterval(finalBurst),5000);
},1200);
};
</script>

</body>
</html>
