<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cake Surprise</title>

<style>
body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#ff7bbd;
font-family:Segoe UI,sans-serif;
overflow:hidden;
}
#wrap{text-align:center;width:100%}

/* CAKE AREA */
#cakeArea{
position:relative;
width:320px;
max-width:90vw;
aspect-ratio:1/1;
margin:auto;
}
#cake{width:100%;display:block;transition:.5s}

/* HALVES */
.half{
display:none;
position:absolute;
top:0;
width:50%;
height:100%;
background:url("https://i.postimg.cc/0yXB2KqV/Chat_GPT_Image_Jan_28_2026_09_39_06_PM_removebg_preview.png") no-repeat;
background-size:200% 100%;
transition:1s ease;
}
#leftHalf{left:0;background-position:left}
#rightHalf{right:0;background-position:right}

/* CANDLES */
.candle{
position:absolute;
top:10%;
width:6%;
height:32%;
background:linear-gradient(#fff,#ffb3d9 70%,transparent);
border-radius:8px;
display:flex;
justify-content:center;
}
.flame{
position:absolute;
top:-22%;
width:90%;
height:28%;
background:radial-gradient(circle,#fff 10%,orange 45%,red 75%);
clip-path:polygon(50% 0%,65% 30%,100% 60%,50% 100%,0% 60%,35% 30%);
animation:flicker .25s infinite alternate;
cursor:pointer;
}
@keyframes flicker{to{transform:scale(1.1)}}

#c1{left:18%}
#c2{left:38%}
#c3{left:58%}
#c4{left:78%}

/* KNIFE (OLD FEEL) */
#knife{
display:none;
width:210px;
max-width:55vw;
position:absolute;
right:-35%;
top:60%;
transform:translateY(-50%);
transition:.6s;
cursor:pointer;
z-index:10;
}

/* TEXT */
#cmd{margin-top:18px;font-size:20px;color:white}

/* BIG TEXT */
#big{
display:none;
position:fixed;
bottom:-200px;
width:100%;
text-align:center;
font-size:38px;
font-weight:800;
color:white;
animation:jump 1s forwards,float 3s infinite ease-in-out;
}
@keyframes jump{to{bottom:70%}}
@keyframes float{50%{transform:translateY(-25px)}}

/* FINAL TEXT */
#finalText{
display:none;
position:fixed;
bottom:-300px;
width:100%;
text-align:center;
color:white;
animation:finalJump 1.2s forwards,finalFloat 3s infinite ease-in-out;
}
#finalText h1{margin:0;font-size:42px}
#finalText h2{margin-top:12px;font-size:30px}
@keyframes finalJump{to{bottom:68%}}
@keyframes finalFloat{50%{transform:translateY(-25px)}}

/* CONFETTI + HEARTS */
.pop,.heart{
position:fixed;
animation:fall linear forwards;
pointer-events:none;
}
@keyframes fall{
to{transform:translateY(120vh);opacity:0}
}

/* BUTTON */
#nextBtn{
display:none;
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
padding:14px 34px;
border:none;
border-radius:40px;
background:#ff2f92;
color:white;
font-size:18px;
cursor:pointer;
}

@media(max-width:600px){
#big{font-size:26px}
#finalText h1{font-size:30px}
#finalText h2{font-size:22px}
}
</style>
</head>

<body>

<audio id="bgMusic" playsinline preload="auto"
src="https://www.dropbox.com/scl/fi/55t9esvgj3vidum8x3srx/bayside-breeze.mp3?dl=1"></audio>
<audio id="yaySound" playsinline preload="auto"
src="https://www.dropbox.com/scl/fi/0mltibx4bgxpuu127pzfo/yay-6326.mp3?dl=1"></audio>
<audio id="boxSound" playsinline preload="auto"
src="https://www.dropbox.com/scl/fi/mzd2i1gqy2rn3bosyuv2l/music-box-birthday.mp3?dl=1"></audio>

<div id="wrap">
<div id="cakeArea">
<img id="cake" src="https://i.postimg.cc/0yXB2KqV/Chat_GPT_Image_Jan_28_2026_09_39_06_PM_removebg_preview.png">

<div id="leftHalf" class="half"></div>
<div id="rightHalf" class="half"></div>

<div class="candle" id="c1"><div class="flame"></div></div>
<div class="candle" id="c2"><div class="flame"></div></div>
<div class="candle" id="c3"><div class="flame"></div></div>
<div class="candle" id="c4"><div class="flame"></div></div>

<img id="knife" src="https://i.postimg.cc/W1LPTTds/website_knife.png">
</div>

<div id="cmd">Tap the flames</div>
</div>

<div id="big">Happiiieesssttt Birthday My Cuttiieesssttt Doll 🧸❤️🤗</div>

<div id="finalText">
<h1>Huuurrrraaaaaaaayyyyyyyyyyyyy!!!!!!!! 🎉🎉🎉</h1>
<h2>Happiest Birthday Once Again My Princess ji 😊❤️</h2>
</div>

<button id="nextBtn" onclick="location.href='next.html'">Let me show u something...</button>

<script>
let flames=document.querySelectorAll(".flame");
let candles=document.querySelectorAll(".candle");
let knife=document.getElementById("knife");
let cake=document.getElementById("cake");
let left=document.getElementById("leftHalf");
let right=document.getElementById("rightHalf");
let big=document.getElementById("big");
let finalText=document.getElementById("finalText");
let nextBtn=document.getElementById("nextBtn");
let cmd=document.getElementById("cmd");

let bgMusic=document.getElementById("bgMusic");
let yaySound=document.getElementById("yaySound");
let boxSound=document.getElementById("boxSound");

let flameDone=false;
let knifeDone=false;

/* CONFETTI */
function pop(){
let p=document.createElement("div");
p.className="pop";
p.innerHTML="🎉";
p.style.left=Math.random()*100+"vw";
p.style.fontSize=15+Math.random()*30+"px";
p.style.animationDuration=1+Math.random()*2+"s";
document.body.appendChild(p);
setTimeout(()=>p.remove(),3000);
}
function heart(){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=15+Math.random()*35+"px";
h.style.animationDuration=2+Math.random()*3+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),5000);
}

/* FLAME */
flames.forEach(f=>{
f.onclick=()=>{
if(flameDone) return;
flameDone=true;

bgMusic.currentTime=0;
bgMusic.play().catch(()=>{});

flames.forEach(x=>x.style.display="none");
candles.forEach(c=>c.style.display="none");
cmd.innerHTML="";
big.style.display="block";

let burst=setInterval(()=>{pop();heart();},40);

setTimeout(()=>{
clearInterval(burst);
knife.style.display="block";
cmd.innerHTML="Tap the Knife to cut the cake";
},5000);
};
});

/* KNIFE */
knife.onclick=()=>{
if(knifeDone) return;
knifeDone=true;

big.style.display="none";
knife.style.transform="translate(-80px,-50%)";

setTimeout(()=>{knife.style.top="calc(60% + 120px)";},600);
setTimeout(()=>{knife.style.top="60%";},1200);

setTimeout(()=>{
cake.style.opacity="0";
left.style.display="block";
right.style.display="block";
left.style.transform="translateX(-60px)";
right.style.transform="translateX(60px)";
finalText.style.display="block";

yaySound.currentTime=0;
yaySound.play();
yaySound.onended=()=>{
boxSound.currentTime=0;
boxSound.play();
};

let finalBurst=setInterval(()=>{pop();heart();},60);
setTimeout(()=>clearInterval(finalBurst),5000);

setTimeout(()=>nextBtn.style.display="block",3000);
},1300);

setTimeout(()=>knife.style.display="none",5200);
};
</script>

</body>
</html>
